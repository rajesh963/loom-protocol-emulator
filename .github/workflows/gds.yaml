name: gds

on:
  push:
    paths:
      - 'src/**'
      - 'rtl/**'
      - 'flow/**'
      - 'tools/sync_src.sh'
      - 'info.yaml'
      - 'librelane_plugin_*.py'
      - 'odb_stripes.py'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Sync canonical RTL into src/
        shell: bash
        run: bash tools/sync_src.sh

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l # or ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a

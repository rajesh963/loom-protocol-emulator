<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <!-- Event scheduler detail. Explicit colours for light and dark themes. -->
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <text x="480" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2328">The event scheduler, in detail</text>
  <text x="480" y="47" font-size="11" text-anchor="middle" fill="#57606a">a thread publishes (when, what); hardware decides the edge — one scheduler per thread, four entries deep</text>

  <!-- thread side -->
  <rect x="20" y="80" width="180" height="210" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="110" y="102" font-size="12" font-weight="bold" text-anchor="middle" fill="#0a3069">thread t (one of 4)</text>
  <text x="110" y="122" font-size="10" text-anchor="middle" fill="#24292f">PERIOD  int[15:4].frac[3:0]</text>
  <text x="110" y="138" font-size="10" text-anchor="middle" fill="#24292f">PFRAC   4-bit carry</text>
  <text x="110" y="154" font-size="10" text-anchor="middle" fill="#24292f">NEXTT   last scheduled t</text>
  <text x="110" y="170" font-size="10" text-anchor="middle" fill="#24292f">TMASK   pins we may drive</text>
  <text x="110" y="186" font-size="10" text-anchor="middle" fill="#24292f">EMASK / ECOND (edge kind)</text>
  <text x="110" y="210" font-size="10" text-anchor="middle" fill="#57606a">instructions that enqueue:</text>
  <text x="110" y="226" font-size="10" text-anchor="middle" fill="#0a3069">emit · emitd · emita · emite</text>
  <text x="110" y="250" font-size="10" text-anchor="middle" fill="#57606a">emit stalls only when the</text>
  <text x="110" y="264" font-size="10" text-anchor="middle" fill="#57606a">queue is full — the other</text>
  <text x="110" y="278" font-size="10" text-anchor="middle" fill="#57606a">threads keep issuing</text>

  <!-- accumulator -->
  <rect x="230" y="80" width="220" height="120" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="340" y="100" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1f2328">12.4 carry accumulator</text>
  <text x="340" y="120" font-size="10" text-anchor="middle" fill="#24292f">sum  = PERIOD + PFRAC   (20 bit)</text>
  <text x="340" y="136" font-size="10" text-anchor="middle" fill="#24292f">t    = NEXTT + (sum &gt;&gt; 4)</text>
  <text x="340" y="152" font-size="10" text-anchor="middle" fill="#24292f">PFRAC = sum[3:0]   NEXTT = t</text>
  <text x="340" y="174" font-size="10" text-anchor="middle" fill="#57606a">period error never accumulates:</text>
  <text x="340" y="188" font-size="10" text-anchor="middle" fill="#57606a">|edge − ideal| &lt; 1 cycle, forever</text>

  <!-- queue -->
  <rect x="490" y="80" width="240" height="180" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="610" y="100" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f5323">event queue — FIFO, depth 4</text>
  <g font-size="9.5" fill="#0f5323" font-family="DejaVu Sans Mono, monospace">
    <rect x="505" y="110" width="210" height="22" fill="#ffffff" stroke="#1a7f37"/>
    <text x="512" y="125">head  {kind, t, val}   ← fires first</text>
    <rect x="505" y="136" width="210" height="22" fill="#ffffff" stroke="#1a7f37"/>
    <text x="512" y="151">{time, 1234, 0x2000}   example</text>
    <rect x="505" y="162" width="210" height="22" fill="#ffffff" stroke="#1a7f37"/>
    <text x="512" y="177">{time, 1755, 0x0000}</text>
    <rect x="505" y="188" width="210" height="22" fill="#ffffff" stroke="#1a7f37"/>
    <text x="512" y="203">{edge, —, 0x8000}   tail</text>
  </g>
  <text x="610" y="232" font-size="10" text-anchor="middle" fill="#0f5323">ordered: a burst of edges can be</text>
  <text x="610" y="246" font-size="10" text-anchor="middle" fill="#0f5323">queued ahead of time</text>

  <!-- comparators -->
  <rect x="760" y="80" width="180" height="180" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="850" y="100" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7d4e00">fire condition</text>
  <text x="850" y="122" font-size="10" text-anchor="middle" fill="#24292f">time kind:</text>
  <text x="850" y="138" font-size="10" text-anchor="middle" fill="#24292f" font-family="DejaVu Sans Mono, monospace">t == TMR</text>
  <text x="850" y="162" font-size="10" text-anchor="middle" fill="#24292f">edge kind:</text>
  <text x="850" y="178" font-size="10" text-anchor="middle" fill="#24292f" font-family="DejaVu Sans Mono, monospace">(pins_in&amp;EMASK)</text>
  <text x="850" y="192" font-size="10" text-anchor="middle" fill="#24292f" font-family="DejaVu Sans Mono, monospace">== (ECOND&amp;EMASK)</text>
  <text x="850" y="216" font-size="10" text-anchor="middle" fill="#57606a">evaluated every cycle, so a</text>
  <text x="850" y="230" font-size="10" text-anchor="middle" fill="#57606a">1-cycle pulse cannot be missed</text>
  <text x="850" y="250" font-size="10" text-anchor="middle" fill="#57606a">(no polling loop involved)</text>

  <!-- TMR -->
  <rect x="230" y="220" width="220" height="40" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="340" y="240" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2328">TMR — free-running 16-bit counter</text>
  <text x="340" y="254" font-size="9.5" text-anchor="middle" fill="#57606a">wraps every 1.0923 ms at 60 MHz; signed-diff compare</text>

  <!-- pin merge -->
  <rect x="230" y="300" width="710" height="120" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="585" y="320" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2328">pin merge — deterministic priority, same cycle</text>
  <g font-size="10" fill="#24292f">
    <text x="250" y="344">instruction OUT/SET/CLR/TOG</text>
    <text x="250" y="362">&lt; host CSR write POUT</text>
    <text x="250" y="380">&lt; t3 &lt; t2 &lt; t1 &lt; t0   (thread 0 wins)</text>
    <text x="250" y="402">&lt; active wave player (overrides everything)</text>
  </g>
  <text x="620" y="344" font-size="10" fill="#57606a">winning write w:</text>
  <text x="620" y="362" font-size="10" fill="#24292f" font-family="DejaVu Sans Mono, monospace">pins_out = (pins_out &amp; ~TMASK_t)</text>
  <text x="620" y="378" font-size="10" fill="#24292f" font-family="DejaVu Sans Mono, monospace">         | (val &amp; TMASK_t)</text>
  <text x="620" y="402" font-size="10" fill="#57606a">so threads never disturb each other's pins</text>

  <!-- output pins -->
  <rect x="230" y="450" width="710" height="70" rx="8" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="585" y="472" font-size="12" font-weight="bold" text-anchor="middle" fill="#0a3069">pins_out[15:0] → uo_out[7:2] + uio_out[7:0]   ·   pins_in[15:0] ← ui_in[7:0] + uio_in[7:0]</text>
  <text x="585" y="492" font-size="10" text-anchor="middle" fill="#57606a">14 protocol pins are drivable, 13 readable, 8 are true bidirectional open-drain (DIR = uio_oe)</text>
  <text x="585" y="508" font-size="10" text-anchor="middle" fill="#0a3069">the edge lands on the exact cycle TMR == t (or on the cycle the pin pattern appears) — not on an instruction retirement</text>

  <!-- arrows -->
  <line x1="200" y1="140" x2="228" y2="140" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="228,140 220,136 220,144" fill="#57606a"/>
  <line x1="450" y1="140" x2="488" y2="140" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="488,140 480,136 480,144" fill="#57606a"/>
  <line x1="730" y1="140" x2="758" y2="140" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="758,140 750,136 750,144" fill="#57606a"/>
  <line x1="340" y1="200" x2="340" y2="218" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="340,218 336,210 344,210" fill="#57606a"/>
  <line x1="850" y1="260" x2="850" y2="300" stroke="#9a6700" stroke-width="1.5"/>
  <polygon points="850,300 846,292 854,292" fill="#9a6700"/>
  <line x1="610" y1="260" x2="610" y2="300" stroke="#1a7f37" stroke-width="1.5"/>
  <polygon points="610,300 606,292 614,292" fill="#1a7f37"/>
  <line x1="480" y1="420" x2="480" y2="448" stroke="#1f2328" stroke-width="1.5"/>
  <polygon points="480,448 476,440 484,440" fill="#1f2328"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <!-- LOOM vs instruction-issue timing. Explicit colours for light/dark themes. -->
  <rect x="0" y="0" width="980" height="580" fill="#ffffff"/>
  <text x="490" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2328">Where the jitter comes from: instruction-issue timing vs scheduled-event timing</text>
  <text x="490" y="47" font-size="11.5" text-anchor="middle" fill="#57606a">UART frame, 115200 baud at 33.33 MHz = 289.352 cycles/bit · 800 px ≈ 2894 cycles · PIO edge error exaggerated ×20 for visibility</text>

  <!-- axis + bit grid -->
  <line x1="120" y1="80" x2="120" y2="400" stroke="#d0d7de" stroke-width="1"/>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="200" y1="80" x2="200" y2="400"/>
    <line x1="280" y1="80" x2="280" y2="400"/>
    <line x1="360" y1="80" x2="360" y2="400"/>
    <line x1="440" y1="80" x2="440" y2="400"/>
    <line x1="520" y1="80" x2="520" y2="400"/>
    <line x1="600" y1="80" x2="600" y2="400"/>
    <line x1="680" y1="80" x2="680" y2="400"/>
    <line x1="760" y1="80" x2="760" y2="400"/>
    <line x1="840" y1="80" x2="840" y2="400"/>
    <line x1="920" y1="80" x2="920" y2="400"/>
  </g>
  <g font-size="9.5" fill="#57606a" text-anchor="middle">
    <text x="160" y="76">START</text>
    <text x="240" y="76">b0</text>
    <text x="320" y="76">b1</text>
    <text x="400" y="76">b2</text>
    <text x="480" y="76">b3</text>
    <text x="560" y="76">b4</text>
    <text x="640" y="76">b5</text>
    <text x="720" y="76">b6</text>
    <text x="800" y="76">b7</text>
    <text x="880" y="76">STOP</text>
  </g>

  <!-- row 1: ideal -->
  <text x="20" y="112" font-size="12" font-weight="bold" fill="#1f2328">ideal</text>
  <text x="20" y="127" font-size="9.5" fill="#57606a">edges at</text>
  <text x="20" y="139" font-size="9.5" fill="#57606a">N·520.83</text>
  <polyline points="120,100 200,100 200,160 280,160 280,100 360,100 360,160 440,160 440,100 520,100 520,160 600,160 600,100 680,100 680,160 760,160 760,100 840,100 840,160 920,160"
            fill="none" stroke="#1a7f37" stroke-width="2"/>
  <text x="930" y="120" font-size="9.5" fill="#0f5323">flat, exact,</text>
  <text x="930" y="133" font-size="9.5" fill="#0f5323">drift-free</text>

  <!-- row 2: instruction-issue (PIO-like) -->
  <text x="20" y="232" font-size="12" font-weight="bold" fill="#1f2328">issue-</text>
  <text x="20" y="246" font-size="12" font-weight="bold" fill="#1f2328">timed</text>
  <text x="20" y="260" font-size="9.5" fill="#57606a">edge =</text>
  <text x="20" y="272" font-size="9.5" fill="#57606a">instruction</text>
  <text x="20" y="284" font-size="9.5" fill="#57606a">retires</text>
  <rect x="112" y="196" width="816" height="64" fill="#fff5f5"/>
  <line x1="112" y1="228" x2="928" y2="228" stroke="#cf222e" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="916" y="222" font-size="9" fill="#82071e">nominal ½-bit line</text>
  <polyline points="120,220 205,220 205,280 278,280 278,220 358,220 358,280 437,280 437,220 523,220 523,280 598,280 598,220 684,220 684,280 759,280 759,220 838,220 838,280 922,280"
            fill="none" stroke="#cf222e" stroke-width="2"/>
  <!-- jitter markers -->
  <g stroke="#cf222e" stroke-width="1">
    <line x1="200" y1="220" x2="205" y2="220" stroke="#cf222e" stroke-width="2"/>
    <line x1="440" y1="220" x2="437" y2="220" stroke="#cf222e" stroke-width="2"/>
    <line x1="680" y1="220" x2="684" y2="220" stroke="#cf222e" stroke-width="2"/>
    <line x1="840" y1="220" x2="838" y2="220" stroke="#cf222e" stroke-width="2"/>
  </g>
  <text x="160" y="192" font-size="9.5" fill="#82071e">PIO SM cycle grid (illustrative)</text>
  <text x="212" y="212" font-size="9" fill="#82071e">+loop pad</text>
  <text x="446" y="212" font-size="9" fill="#82071e">−branch taken</text>
  <text x="600" y="300" font-size="9.5" fill="#82071e">every added instruction shifts all later edges → firmware is cycle-counted</text>

  <!-- row 3: LOOM -->
  <text x="20" y="352" font-size="12" font-weight="bold" fill="#1f2328">LOOM</text>
  <text x="20" y="367" font-size="9.5" fill="#57606a">edge =</text>
  <text x="20" y="379" font-size="9.5" fill="#57606a">scheduled</text>
  <text x="20" y="391" font-size="9.5" fill="#57606a">cycle</text>
  <rect x="112" y="316" width="816" height="64" fill="#dafbe1"/>
  <line x1="112" y1="348" x2="928" y2="348" stroke="#1a7f37" stroke-width="0.8" stroke-dasharray="3,3"/>
  <polyline points="120,340 200,340 200,400 280,400 280,340 360,340 360,400 440,400 440,340 520,340 520,400 600,400 600,340 680,340 680,400 760,400 760,340 840,340 840,400 920,400"
            fill="none" stroke="#1a7f37" stroke-width="2"/>
  <g font-size="8.5" fill="#0f5323" text-anchor="middle">
    <text x="160" y="334">290</text>
    <text x="240" y="334">579</text>
    <text x="320" y="334">868</text>
    <text x="400" y="334">1157</text>
    <text x="480" y="334">1447</text>
    <text x="560" y="334">1736</text>
    <text x="640" y="334">2025</text>
    <text x="720" y="334">2315</text>
    <text x="800" y="334">2604</text>
  </g>
  <text x="600" y="416" font-size="9.5" fill="#0f5323">the thread may take 3 or 30 cycles per bit: the edge is already in the queue</text>

  <!-- NEXTT table inset -->
  <rect x="120" y="434" width="800" height="126" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="132" y="453" font-size="11" font-weight="bold" fill="#1f2328">Why it does not drift: 12.4 fixed-point accumulation (PERIOD = 0x1216 = 289.375 cycles @ 33.33 MHz)</text>
  <g font-size="10" fill="#24292f" font-family="DejaVu Sans Mono, monospace">
    <text x="140" y="474">event #   NEXTT (exact)   NEXTT (16-bit int)   ideal (n·520.8333)   error [cycles]</text>
    <text x="140" y="492">1         289.3750        289                  289.3520             +0.0230</text>
    <text x="140" y="506">2         578.7500        578                  578.7038             +0.0460</text>
    <text x="140" y="520">3         868.1250        868                  868.0556             +0.0690</text>
    <text x="140" y="534">4         1157.5000       1157                 1157.4074            +0.0920</text>
    <text x="140" y="548">5         1446.8750       1446                 1446.7593            +0.1150</text>
  </g>
  <text x="560" y="474" font-size="9.5" fill="#57606a">period error ~+80 ppm</text>
  <text x="560" y="488" font-size="9.5" fill="#57606a">never accumulates (phase error &lt; 0.2 cycle over a frame).</text>
  <text x="560" y="502" font-size="9.5" fill="#57606a">The register value is 289.375 vs the exact</text>
  <text x="560" y="516" font-size="9.5" fill="#57606a">289.352 — a +80 ppm period error.</text>
  <text x="560" y="534" font-size="9.5" fill="#57606a">UART tolerance is ±2 %; SPI/I2C are</text>
  <text x="560" y="548" font-size="9.5" fill="#57606a">sampled-edge, so this is invisible.</text>
</svg>

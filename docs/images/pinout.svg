<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <!-- LOOM pinout / pad ring. Explicit colours for light and dark themes. -->
  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>
  <text x="480" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2328">LOOM pinout — 24 digital pads: 19 protocol pins + 5 host-link pins</text>
  <text x="480" y="47" font-size="11" text-anchor="middle" fill="#57606a">names below are the example firmware assignment; every protocol function is software-muxed onto any protocol pin</text>

  <!-- die -->
  <rect x="290" y="120" width="380" height="410" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="2"/>
  <text x="480" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328">tt_um_rajesh963_loom</text>
  <text x="480" y="262" font-size="11" text-anchor="middle" fill="#57606a">IHP CMOS5L · 8×4 tiles ≈ 1.00 mm²</text>
  <text x="480" y="280" font-size="11" text-anchor="middle" fill="#57606a">clk 60 MHz · asynch rst_n</text>
  <text x="480" y="330" font-size="10" text-anchor="middle" fill="#57606a">4 threads · 4 event queues</text>
  <text x="480" y="346" font-size="10" text-anchor="middle" fill="#57606a">PMEM 1024×32 · DMEM 64×16</text>
  <text x="480" y="362" font-size="10" text-anchor="middle" fill="#57606a">wave player · SPI host bridge</text>

  <!-- LEFT: ui[0..7] -->
  <g font-size="10.5">
    <!-- host pins -->
    <g>
      <rect x="270" y="142" width="20" height="16" fill="#0969da" stroke="#0969da"/>
      <rect x="270" y="172" width="20" height="16" fill="#0969da" stroke="#0969da"/>
      <rect x="270" y="202" width="20" height="16" fill="#0969da" stroke="#0969da"/>
      <text x="258" y="154" text-anchor="end" fill="#0a3069" font-weight="bold">ui[0]</text>
      <text x="228" y="154" text-anchor="end" fill="#0a3069">H_CS_N  host select (in)</text>
      <text x="258" y="184" text-anchor="end" fill="#0a3069" font-weight="bold">ui[1]</text>
      <text x="228" y="184" text-anchor="end" fill="#0a3069">H_SCK  host clock (in)</text>
      <text x="258" y="214" text-anchor="end" fill="#0a3069" font-weight="bold">ui[2]</text>
      <text x="228" y="214" text-anchor="end" fill="#0a3069">H_MOSI  host data in</text>
    </g>
    <!-- protocol inputs -->
    <g>
      <rect x="270" y="238" width="20" height="16" fill="#1a7f37" stroke="#1a7f37"/>
      <rect x="270" y="268" width="20" height="16" fill="#1a7f37" stroke="#1a7f37"/>
      <rect x="270" y="298" width="20" height="16" fill="#1a7f37" stroke="#1a7f37"/>
      <rect x="270" y="328" width="20" height="16" fill="#1a7f37" stroke="#1a7f37"/>
      <rect x="270" y="358" width="20" height="16" fill="#1a7f37" stroke="#1a7f37"/>
      <text x="258" y="250" text-anchor="end" fill="#0f5323" font-weight="bold">ui[3] = P11</text>
      <text x="232" y="250" text-anchor="end" fill="#0f5323">UART_RX</text>
      <text x="258" y="280" text-anchor="end" fill="#0f5323" font-weight="bold">ui[4] = P12</text>
      <text x="232" y="280" text-anchor="end" fill="#0f5323">SPI_MISO</text>
      <text x="258" y="310" text-anchor="end" fill="#0f5323" font-weight="bold">ui[5] = P13</text>
      <text x="232" y="310" text-anchor="end" fill="#0f5323">TRIG_IN / spare</text>
      <text x="258" y="340" text-anchor="end" fill="#0f5323" font-weight="bold">ui[6] = P14</text>
      <text x="232" y="340" text-anchor="end" fill="#0f5323">WAVE_IN0</text>
      <text x="258" y="370" text-anchor="end" fill="#0f5323" font-weight="bold">ui[7] = P15</text>
      <text x="232" y="370" text-anchor="end" fill="#0f5323">WAVE_IN1</text>
    </g>
    <text x="150" y="420" font-size="10" text-anchor="middle" fill="#57606a">input-only pads → pins_in[15:8]</text>
  </g>

  <!-- RIGHT: uo[0..7] -->
  <g font-size="10.5">
    <g>
      <rect x="670" y="142" width="20" height="16" fill="#0969da" stroke="#0969da"/>
      <rect x="670" y="172" width="20" height="16" fill="#0969da" stroke="#0969da"/>
      <text x="702" y="154" fill="#0a3069" font-weight="bold">uo[0]</text>
      <text x="748" y="154" fill="#0a3069">H_MISO  host data out</text>
      <text x="702" y="184" fill="#0a3069" font-weight="bold">uo[1]</text>
      <text x="748" y="184" fill="#0a3069">H_IRQ  host interrupt (level)</text>
    </g>
    <g>
      <rect x="670" y="208" width="20" height="16" fill="#bc4c00" stroke="#bc4c00"/>
      <rect x="670" y="238" width="20" height="16" fill="#bc4c00" stroke="#bc4c00"/>
      <rect x="670" y="268" width="20" height="16" fill="#bc4c00" stroke="#bc4c00"/>
      <rect x="670" y="298" width="20" height="16" fill="#bc4c00" stroke="#bc4c00"/>
      <rect x="670" y="328" width="20" height="16" fill="#bc4c00" stroke="#bc4c00"/>
      <rect x="670" y="358" width="20" height="16" fill="#bc4c00" stroke="#bc4c00"/>
      <text x="702" y="220" fill="#7d2c00" font-weight="bold">uo[2] = P10</text>
      <text x="748" y="220" fill="#7d2c00">SPI_SCK</text>
      <text x="702" y="250" fill="#7d2c00" font-weight="bold">uo[3] = P11</text>
      <text x="748" y="250" fill="#7d2c00">SPI_MOSI</text>
      <text x="702" y="280" fill="#7d2c00" font-weight="bold">uo[4] = P12</text>
      <text x="748" y="280" fill="#7d2c00">SPI_CS_N</text>
      <text x="702" y="310" fill="#7d2c00" font-weight="bold">uo[5] = P13</text>
      <text x="748" y="310" fill="#7d2c00">UART_TX</text>
      <text x="702" y="340" fill="#7d2c00" font-weight="bold">uo[6] = P14</text>
      <text x="748" y="340" fill="#7d2c00">WS2812_DATA</text>
      <text x="702" y="370" fill="#7d2c00" font-weight="bold">uo[7] = P15</text>
      <text x="748" y="370" fill="#7d2c00">WAVE_OUT0 / spare</text>
    </g>
    <text x="810" y="420" font-size="10" text-anchor="middle" fill="#57606a">output-only pads → pins_out[15:8]</text>
  </g>

  <!-- BOTTOM: uio[0..7] -->
  <g font-size="10.5">
    <rect x="318" y="524" width="16" height="20" fill="#8250df" stroke="#8250df"/>
    <rect x="362" y="524" width="16" height="20" fill="#8250df" stroke="#8250df"/>
    <rect x="406" y="524" width="16" height="20" fill="#8250df" stroke="#8250df"/>
    <rect x="450" y="524" width="16" height="20" fill="#8250df" stroke="#8250df"/>
    <rect x="494" y="524" width="16" height="20" fill="#8250df" stroke="#8250df"/>
    <rect x="538" y="524" width="16" height="20" fill="#8250df" stroke="#8250df"/>
    <rect x="582" y="524" width="16" height="20" fill="#8250df" stroke="#8250df"/>
    <rect x="626" y="524" width="16" height="20" fill="#8250df" stroke="#8250df"/>
    <g fill="#4a1d73">
      <text x="326" y="558" text-anchor="end" transform="rotate(-90 326 558)" font-weight="bold">uio[0] I2C_SCL</text>
      <text x="370" y="558" text-anchor="end" transform="rotate(-90 370 558)" font-weight="bold">uio[1] I2C_SDA</text>
      <text x="414" y="558" text-anchor="end" transform="rotate(-90 414 558)" font-weight="bold">uio[2] PS2_CLK</text>
      <text x="458" y="558" text-anchor="end" transform="rotate(-90 458 558)" font-weight="bold">uio[3] PS2_DAT</text>
      <text x="502" y="558" text-anchor="end" transform="rotate(-90 502 558)" font-weight="bold">uio[4] ONEWIRE</text>
      <text x="546" y="558" text-anchor="end" transform="rotate(-90 546 558)" font-weight="bold">uio[5] spare B0</text>
      <text x="590" y="558" text-anchor="end" transform="rotate(-90 590 558)" font-weight="bold">uio[6] spare B1</text>
      <text x="634" y="558" text-anchor="end" transform="rotate(-90 634 558)" font-weight="bold">uio[7] spare B2</text>
    </g>
    <text x="480" y="628" font-size="10.5" text-anchor="middle" fill="#4a1d73">bidirectional pads → pins_in[7:0] / pins_out[7:0] / uio_oe[7:0] = DIR</text>
  </g>

  <!-- legend -->
  <rect x="30" y="470" width="180" height="150" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="42" y="490" font-size="11" font-weight="bold" fill="#1f2328">legend</text>
  <rect x="42" y="500" width="12" height="12" fill="#0969da"/>
  <text x="62" y="510" font-size="10" fill="#24292f">host link (5 pads, not protocol)</text>
  <rect x="42" y="522" width="12" height="12" fill="#1a7f37"/>
  <text x="62" y="532" font-size="10" fill="#24292f">protocol in-only (5)</text>
  <rect x="42" y="544" width="12" height="12" fill="#bc4c00"/>
  <text x="62" y="554" font-size="10" fill="#24292f">protocol out-only (6)</text>
  <rect x="42" y="566" width="12" height="12" fill="#8250df"/>
  <text x="62" y="576" font-size="10" fill="#24292f">protocol bidir / open drain (8)</text>
  <text x="42" y="596" font-size="10" fill="#57606a">19 protocol pins: 14 drivable,</text>
  <text x="42" y="610" font-size="10" fill="#57606a">13 readable</text>

  <!-- mapping note -->
  <rect x="740" y="470" width="190" height="150" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="752" y="490" font-size="11" font-weight="bold" fill="#1f2328">pin-vector mapping</text>
  <g font-size="9.5" fill="#24292f" font-family="DejaVu Sans Mono, monospace">
    <text x="752" y="508">pins_out[15:10]=uo[7:2]</text>
    <text x="752" y="522">pins_out[9:8]  =host</text>
    <text x="752" y="536">pins_out[7:0]  =uio_out</text>
    <text x="752" y="556">pins_in[15:8]  =ui[7:0]</text>
    <text x="752" y="570">pins_in[7:0]   =uio_in</text>
    <text x="752" y="590">DIR[7:0]       =uio_oe</text>
  </g>
  <text x="752" y="610" font-size="9" fill="#57606a">P[9:8] are the host outputs;</text>
  <text x="752" y="622" font-size="9" fill="#57606a">in/out halves can differ.</text>
</svg>

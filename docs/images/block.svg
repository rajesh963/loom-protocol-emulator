<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <!-- LOOM block diagram. Hand-written SVG, explicit colours for light/dark themes.
       Layout grid: row1 y=60-140, bus y=165-195, threads y=230-330, issue 350-390,
       schedulers 410-460, pin unit 475-515, pins strip right column 480-570. -->
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <text x="490" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2328">LOOM — four threads, one shared datapath, hardware event schedulers</text>
  <text x="490" y="49" font-size="11.5" text-anchor="middle" fill="#57606a">software decides WHAT to drive · the event scheduler decides WHEN · 60 MHz · 19 protocol pins</text>

  <!-- row 1: host + bridge -->
  <rect x="20" y="60" width="150" height="80" rx="7" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="95" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#0a3069">Host (SPI master)</text>
  <text x="95" y="97" font-size="10" text-anchor="middle" fill="#24292f">MCU / RP2350</text>
  <text x="95" y="112" font-size="10" text-anchor="middle" fill="#57606a">loads program + data,</text>
  <text x="95" y="126" font-size="10" text-anchor="middle" fill="#57606a">streams bytes, polls IRQ</text>

  <rect x="190" y="60" width="190" height="80" rx="7" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="285" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2328">Host bridge</text>
  <text x="285" y="97" font-size="10" text-anchor="middle" fill="#24292f">SPI slave, mode 0, MSB first, ≤ 10 MHz</text>
  <text x="285" y="112" font-size="10" text-anchor="middle" fill="#24292f">2-FF sync + SCK edge detect</text>
  <text x="285" y="126" font-size="10" text-anchor="middle" fill="#57606a">13 commands · IRQ latch · FIFO ports</text>

  <line x1="170" y1="88" x2="188" y2="88" stroke="#0969da" stroke-width="1.5"/>
  <polygon points="188,88 181,84 181,92" fill="#0969da"/>
  <line x1="188" y1="112" x2="170" y2="112" stroke="#0969da" stroke-width="1.5"/>
  <polygon points="170,112 177,108 177,116" fill="#0969da"/>
  <text x="95" y="153" font-size="9" text-anchor="middle" fill="#57606a">H_CS_N H_SCK H_MOSI / H_MISO H_IRQ</text>

  <!-- bus -->
  <rect x="190" y="165" width="580" height="30" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="480" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#7d4e00">core ↔ host ↔ peripheral bus: memory port · CSR port (0x00-0x1C) · FIFO ports · IRQ/status</text>
  <line x1="285" y1="140" x2="285" y2="163" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="285,163 281,155 289,155" fill="#57606a"/>

  <!-- right column: memories + TMR -->
  <rect x="800" y="60" width="160" height="70" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="880" y="79" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1f2328">PMEM 1024 × 32</text>
  <text x="880" y="95" font-size="9.5" text-anchor="middle" fill="#24292f">program, 1-cycle read</text>
  <text x="880" y="109" font-size="9.5" text-anchor="middle" fill="#24292f">FF ⇄ IHP 1024×32 SRAM</text>
  <text x="880" y="123" font-size="9.5" text-anchor="middle" fill="#57606a">host-writable only</text>

  <rect x="800" y="140" width="160" height="70" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="880" y="159" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1f2328">DMEM 64 × 16</text>
  <text x="880" y="175" font-size="9.5" text-anchor="middle" fill="#24292f">scratch · wave patterns</text>
  <text x="880" y="189" font-size="9.5" text-anchor="middle" fill="#24292f">capture ring (stretch)</text>
  <text x="880" y="203" font-size="9.5" text-anchor="middle" fill="#57606a">1 CPU rw + 1 wave read</text>

  <rect x="800" y="220" width="160" height="42" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="880" y="239" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2328">TMR: 16-bit cycle counter</text>
  <text x="880" y="254" font-size="9" text-anchor="middle" fill="#57606a">wraps every 1.0923 ms @ 60 MHz</text>

  <!-- bus to right column trunk -->
  <line x1="770" y1="180" x2="785" y2="180" stroke="#9a6700" stroke-width="1.5"/>
  <line x1="785" y1="95" x2="785" y2="241" stroke="#9a6700" stroke-width="1.5"/>
  <line x1="785" y1="95" x2="800" y2="95" stroke="#9a6700" stroke-width="1.5"/>
  <line x1="785" y1="175" x2="800" y2="175" stroke="#9a6700" stroke-width="1.5"/>
  <line x1="785" y1="241" x2="800" y2="241" stroke="#9a6700" stroke-width="1.5"/>

  <!-- threads -->
  <rect x="190" y="230" width="135" height="100" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="257" y="249" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0a3069">Thread 0</text>
  <text x="257" y="265" font-size="9.5" text-anchor="middle" fill="#24292f">PC · R0-R7 · Z,C</text>
  <text x="257" y="279" font-size="9.5" text-anchor="middle" fill="#24292f">PERIOD 12.4 · PFRAC</text>
  <text x="257" y="293" font-size="9.5" text-anchor="middle" fill="#24292f">NEXTT · TMASK</text>
  <text x="257" y="307" font-size="9.5" text-anchor="middle" fill="#24292f">EMASK/ECOND · EQ×4</text>
  <text x="257" y="321" font-size="9.5" text-anchor="middle" fill="#24292f">TX/RX FIFO 8×8</text>

  <rect x="335" y="230" width="135" height="100" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="402" y="249" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0a3069">Thread 1</text>
  <text x="402" y="268" font-size="9.5" text-anchor="middle" fill="#24292f">identical state slot:</text>
  <text x="402" y="282" font-size="9.5" text-anchor="middle" fill="#24292f">own PC, registers, period,</text>
  <text x="402" y="296" font-size="9.5" text-anchor="middle" fill="#24292f">queue and FIFOs</text>
  <text x="402" y="315" font-size="9.5" text-anchor="middle" fill="#57606a">4 threads total</text>

  <rect x="480" y="230" width="135" height="100" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="547" y="249" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0a3069">Thread 2</text>
  <text x="547" y="268" font-size="9.5" text-anchor="middle" fill="#24292f">four protocols can run</text>
  <text x="547" y="282" font-size="9.5" text-anchor="middle" fill="#24292f">at once with independent</text>
  <text x="547" y="296" font-size="9.5" text-anchor="middle" fill="#24292f">fractional time bases</text>

  <rect x="625" y="230" width="135" height="100" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="692" y="249" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0a3069">Thread 3</text>
  <text x="692" y="268" font-size="9.5" text-anchor="middle" fill="#24292f">capacity: 1 instruction</text>
  <text x="692" y="282" font-size="9.5" text-anchor="middle" fill="#24292f">issued per cycle, shared</text>
  <text x="692" y="296" font-size="9.5" text-anchor="middle" fill="#24292f">by all four threads</text>

  <line x1="480" y1="195" x2="480" y2="228" stroke="#9a6700" stroke-width="1.5"/>
  <polygon points="480,228 476,220 484,220" fill="#9a6700"/>

  <!-- issue -->
  <rect x="190" y="350" width="570" height="40" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="475" y="367" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1f2328">shared issue slot — work-conserving round robin, 1 instruction / cycle</text>
  <text x="475" y="382" font-size="9.5" text-anchor="middle" fill="#57606a">a stalled thread is skipped; issue order never affects a scheduled edge</text>
  <line x1="475" y1="330" x2="475" y2="348" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="475,348 471,340 479,340" fill="#57606a"/>

  <!-- schedulers -->
  <rect x="190" y="410" width="570" height="50" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="475" y="428" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f5323">event schedulers — 4 threads × queue depth 4, entries {kind, t, val}</text>
  <text x="475" y="442" font-size="9.5" text-anchor="middle" fill="#0f5323">timed (due or overdue) · edge-triggered (pin-pattern match) → fire at the exact cycle</text>
  <text x="475" y="455" font-size="9" text-anchor="middle" fill="#0f5323">TMR==t or (t-TMR)&amp;0xFFFF ≥ 0x8000</text>
  <line x1="475" y1="390" x2="475" y2="408" stroke="#1a7f37" stroke-width="1.5"/>
  <polygon points="475,408 471,400 479,400" fill="#1a7f37"/>

  <!-- pin unit -->
  <rect x="190" y="475" width="570" height="40" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="475" y="492" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1f2328">pin unit — deterministic priority</text>
  <text x="475" y="507" font-size="9.5" text-anchor="middle" fill="#57606a">t0 &gt; t1 &gt; t2 &gt; t3 &gt; CSR POUT &gt; instruction OUT/SET/CLR/TOG · wave player overrides all · DIR = uio_oe</text>
  <line x1="475" y1="460" x2="475" y2="473" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="475,473 471,465 479,465" fill="#57606a"/>

  <!-- pins strip -->
  <rect x="800" y="480" width="160" height="100" rx="6" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="880" y="499" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0a3069">19 protocol pins</text>
  <text x="880" y="515" font-size="9.5" text-anchor="middle" fill="#24292f">ui[7:3] · uo[7:2] · uio[7:0]</text>
  <text x="880" y="529" font-size="9.5" text-anchor="middle" fill="#24292f">14 drivable · 13 readable</text>
  <text x="880" y="543" font-size="9.5" text-anchor="middle" fill="#24292f">uio[7:0] true bidirectional</text>
  <text x="880" y="557" font-size="9.5" text-anchor="middle" fill="#57606a">any function on any pin</text>
  <text x="880" y="571" font-size="9.5" text-anchor="middle" fill="#57606a">by firmware</text>
  <line x1="760" y1="495" x2="798" y2="495" stroke="#0969da" stroke-width="1.5"/>
  <polygon points="798,495 790,491 790,499" fill="#0969da"/>

  <!-- wave player -->
  <rect x="800" y="280" width="160" height="90" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="880" y="299" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4a1d73">Wave player</text>
  <text x="880" y="315" font-size="9.5" text-anchor="middle" fill="#24292f">DMEM → 16-bit pin pattern</text>
  <text x="880" y="329" font-size="9.5" text-anchor="middle" fill="#24292f">one pattern per WPER cycles</text>
  <text x="880" y="343" font-size="9.5" text-anchor="middle" fill="#24292f">loop / one-shot · 1-64 words</text>
  <text x="880" y="359" font-size="9.5" text-anchor="middle" fill="#57606a">60 M patterns/s peak</text>

  <!-- capture (stretch) -->
  <rect x="800" y="385" width="160" height="78" rx="6" fill="#fff5f5" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="880" y="404" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#82071e">Capture (stretch)</text>
  <text x="880" y="420" font-size="9.5" text-anchor="middle" fill="#24292f">timestamped pin edges</text>
  <text x="880" y="434" font-size="9.5" text-anchor="middle" fill="#24292f">→ DMEM ring buffer</text>
  <text x="880" y="450" font-size="9.5" text-anchor="middle" fill="#57606a">record &amp; replay</text>

  <!-- wave player feeds the pin unit -->
  <polyline points="800,325 778,325 778,481" fill="none" stroke="#8250df" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="778,481 774,473 782,473" fill="#8250df"/>
  <text x="762" y="318" font-size="8.5" text-anchor="middle" fill="#4a1d73">patterns</text>
</svg>

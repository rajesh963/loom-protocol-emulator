project:
  title: 'LOOM: a programmable protocol loom'
  author: Rajesh Malladi
  discord: ''
  description: 'A programmable protocol loom: 4 threads and a hardware event scheduler drive bit-exact
    UART, SPI, I2C and more; loaded over SPI after fabrication.'
  language: Verilog
  clock_hz: 33333333
  tiles: 8x4
  top_module: tt_um_rajesh963_loom
  # `loom_sram_model.v` is SIM-only (behavioural SRAM for iverilog/cocotb) and is deliberately NOT
  # listed here; `pdn_cfg.tcl` is referenced by the flow's PDN_CFG, not compiled as a Verilog source.
  source_files:
  - loom_bus.vh
  - loom_mem.v
  - loom_core.v
  - loom_host.v
  - loom_wave.v
  - loom_pmem_sram.v
  - sram_bb.v
  - tt_um_rajesh963_loom.v
pinout:
  ui[0]: H_CS_N
  ui[1]: H_SCK
  ui[2]: H_MOSI
  ui[3]: UART_RX
  ui[4]: SPI_CS_IN
  ui[5]: TRIG_IN
  ui[6]: WAVE_IN0
  ui[7]: WAVE_IN1
  uo[0]: H_MISO
  uo[1]: H_IRQ
  uo[2]: UART_TX
  uo[3]: SPI_CS_N
  uo[4]: WS2812_DATA
  uo[5]: SPARE_OUT
  uo[6]: WAVE_OUT0
  uo[7]: WAVE_OUT1
  uio[0]: I2C_SCL
  uio[1]: I2C_SDA
  uio[2]: PS2_CLK
  uio[3]: PS2_DAT
  uio[4]: ONEWIRE
  uio[5]: SPI_SCK
  uio[6]: SPI_MOSI
  uio[7]: SPI_MISO
yaml_version: 6
